
name: WatBook CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version
        shell: powershell

      - name: Build Docker Image
        run: docker build -t watbook-app .
        shell: powershell

      - name: Stop and Remove Existing Container
        run: |
          $existing = docker ps -a --format "{{.Names}}"

          if ($existing -contains "watbook-container") {
              docker rm -f watbook-container
          }
        shell: powershell

      - name: Deploy WatBook Container
        run: docker run -d --name watbook-container -p 8100:80 watbook-app
        shell: powershell

      - name: Verify Deployment
        run: docker ps
        shell: powershell
