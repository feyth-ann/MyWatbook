
name: WatBook CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Build Ionic Angular App
        run: npm run build

      - name: Build Docker Image
        run: docker build -t watbook-crud:latest .

      - name: Remove Previous Container
        shell: powershell
        run: |
          docker rm -f watbook-crud-container 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous container found."
          }

      - name: Deploy Docker Container
        run: docker run -d --name watbook-crud-container -p 8100:8100 watbook-crud:latest
